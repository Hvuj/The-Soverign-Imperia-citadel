<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Intelligence — The Sovereign Imperia Citadel Z</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="workspace.css?v=20260608-workspace-intel">
</head>
<body>

  <header class="topbar">
    <a class="topbar-logo" href="graph.html">
      <span class="logo-dot"></span>The Sovereign Imperia Citadel Z
    </a>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Page breadcrumb">
      <span class="crumb-current">Workspace Intelligence</span>
    </nav>
    <div class="topbar-actions">
      <a class="btn btn-secondary" href="graph.html">
        <i class="bi bi-diagram-3"></i> Graph
      </a>
    </div>
  </header>

  <div class="page-shell">

    <div class="page-header">
      <h1 class="page-title">Workspace Intelligence</h1>
      <p id="page-subtitle" class="page-subtitle">All workspace repos — metadata, symbols, features, reuse candidates</p>
    </div>

    <!-- Summary -->
    <div id="summary-area" class="card">
      <div class="loading-msg">Loading workspace summary…</div>
    </div>

    <!-- Search / reuse -->
    <div class="card">
      <div class="card-title">Search</div>
      <div class="search-row">
        <input id="search-input" class="search-input" type="text"
               placeholder="Search files, symbols, modules… (BM25)" autocomplete="off">
        <button id="search-btn" class="btn">Search</button>
      </div>
      <div class="card-title" style="margin-top:14px">Reuse query</div>
      <div class="search-row">
        <input id="reuse-input" class="search-input" type="text"
               placeholder="What do you want to reuse? e.g. a sample feature, sample rate, schema-validation check" autocomplete="off">
        <button id="reuse-btn" class="btn">Find reuse</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Repo cards -->
    <div class="section">
      <div class="section-title">Repos</div>
      <div id="repo-grid" class="repo-grid">
        <div class="loading-msg">Loading repos…</div>
      </div>
    </div>

  </div>

  <script src="workspace.js?v=20260608-workspace-intel"></script>
  <script>
    document.addEventListener("DOMContentLoaded", initWorkspacePage);
  </script>
</body>
</html>
