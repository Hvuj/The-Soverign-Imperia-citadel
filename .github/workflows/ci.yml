name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository code
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Provision uv 
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false 

      # Step 3: Explicitly cache the virtual environment directories
      - name: Cache Virtual Environment and uv Store
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Step 4: Provision Python runtime
      - name: Set up Python
        run: uv python install

      # Step 5: Install dependencies (Strict replication of the user's pushed environment)
      # Rebuilds the venv ONLY on a cache miss, relying entirely on the frozen lockfile.
      - name: Install Dependencies from Lockfile
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv sync --frozen

      # Step 6: Verify pyproject.toml matches uv.lock
      # This step fails the CI if the user changed pyproject.toml but forgot to run 'uv lock' locally.
      - name: Check if Lockfile is Out of Date
        run: |
          echo "Verifying that pyproject.toml matches the committed uv.lock file..."
          uv lock --check

      # Step 7: Run tests inside the strictly replicated workspace
      - name: Run Test Suite
        run: uv run --frozen pytest tests/
