name: Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Install uv
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false

      # Step 3: Install the project's Python version
      - name: Set Up Python
        run: uv python install

      # Step 4: Cache the virtual environment and uv package cache
      - name: Cache Virtual Environment and uv Store
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: |
            .venv
            $HOME/.cache/uv
            $HOME/.local/share/uv
          key: uv-${{ github.repository }}-${{ github.ref_name }}-${{ runner.os }}-${{ hashFiles('uv.lock','pyproject.toml') }}
          restore-keys: |
            uv-${{ github.repository }}-${{ github.ref_name }}-${{ runner.os }}-
            uv-${{ github.repository }}-

      # Step 5: Synchronize the environment from the lockfile.
      # Safe to run every time; uv only installs what's missing.
      - name: Install Dependencies from Lockfile
        run: uv sync --frozen

      # Step 6: Ensure pyproject.toml and uv.lock are in sync
      - name: Check if Lockfile is Out of Date
        run: |
          echo "Verifying that pyproject.toml matches the committed uv.lock file..."
          uv lock --check

      # Step 7: Run the test suite
      - name: Run Test Suite
        run: uv run --frozen pytest tests/

  code_review_job:
    runs-on: ubuntu-latest
    name: ChatGPT Code Review
    steps:
      - name: GenAI Code Review
        uses: cirolini/genai-code-review@v2
        with:
          openai_api_key: ${{ secrets.openai_api_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}
          openai_model: "gpt-3.5-turbo"
          openai_temperature: 0.5
          openai_max_tokens: 2048
          mode: files
          language: en
          custom_prompt: ""
